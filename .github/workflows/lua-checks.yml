name: Lua checks
on:
  pull_request:
  push:
    branches: [main, next]
permissions:
  contents: read
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Parse every Lua source
        run: find gamemodes -name '*.lua' -print0 | xargs -0 -n1 luajit -bl > /dev/null
      - name: Verify SHA-256, HMAC and pinned API origins
        run: luajit tests/apiauth_test.lua
